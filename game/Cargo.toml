[package]
name = "rb-game"
version.workspace = true
edition.workspace = true

[dependencies]
rb-shared = { path = "../shared" }

serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
tokio.workspace = true

bevy = { version = "0.18", features = ["wav"] }
avian3d = "0.5"
rand = "0.9"
crossbeam-channel = "0.5"
tonic = "0.12"
prost = "0.13"
image = "0.25"
flate2 = "1.1.9"
bevy_hanabi = "0.18.0"
hound = "3.5.1"
anyhow = "1.0.102"
bevy-tnua = "0.29"
bevy-tnua-avian3d = "0.10"
mpeg2_player_v2 = { path = "../utils/mpeg2_player_v2" }

[features]
# Emit a Chrome-tracing JSON to the cwd on clean shutdown.
# Run with `cargo run --release --features trace`, then drop the
# resulting `trace-*.json` into chrome://tracing or ui.perfetto.dev.
trace = ["bevy/trace_chrome"]
